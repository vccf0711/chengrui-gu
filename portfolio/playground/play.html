<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">
        <h1>CSS Playground</h1>
        <p class="intro">
            This composition explores colourful geometric abstraction using regular shapes, bright colours and structured arrangement. It is created with HTML div elements and CSS properties such as position, colour, border-radius and layering.
        </p>

        <div id="frame">
            <div id="artboard">

                <!--top row-->
                <div class="shape circle red" id="c1"></div>
                <div class="shape circle blue" id="c2"></div>
                <div class="shape circle yellow" id="c3"></div>

                <div class="shape rect-h teal" id="r1"></div>
                <div class="shape rect-h orange" id="r2"></div>
                <div class="shape rect-h pink" id="r3"></div>

                <!--left section-->
                <div class="shape bar-h red" id="b1"></div>
                <div class="shape bar-h blue" id="b2"></div>
                <div class="shape bar-h yellow" id="b3"></div>
                <div class="shape bar-h green" id="b4"></div>

                <div class="shape square purple" id="s1"></div>
                <div class="shape square orange" id="s9"></div>
                <div class="shape square cyan" id="s10"></div>

                <!--centre section-->
                <div class="shape big-square yellow" id="big1"></div>
                <div class="shape square red" id="s2"></div>
                <div class="shape square blue" id="s3"></div>
                <div class="shape square teal" id="s11"></div>
                <div class="shape square pink" id="s12"></div>
                <div class="shape bar-h green" id="b5"></div>
                <div class="shape bar-h orange" id="b6"></div>

                <!--right section-->
                <div class="shape circle cyan" id="c7"></div>
                <div class="shape circle yellow" id="c8"></div>
                <div class="shape circle pink" id="c9"></div>
                <div class="shape circle green" id="c10"></div>

                <div class="shape rect-v red" id="v1"></div>
                <div class="shape square white" id="s4"></div>
                <div class="shape square purple" id="s5"></div>
                <div class="shape rect-h blue" id="r5"></div>

                <!--bottom row-->
                <div class="shape square red" id="s6"></div>
                <div class="shape square yellow" id="s7"></div>
                <div class="shape square blue" id="s8"></div>

                <div class="shape circle pink" id="c11"></div>
                <div class="shape circle teal" id="c12"></div>
                <div class="shape circle orange" id="c13"></div>

                <div class="shape bar-h purple" id="b7"></div>
                <div class="shape bar-h lime" id="b8"></div>

            </div>
        </div>

        <p class="back-link">
            <a href="../index.html">Back to Portfolio</a>
        </p>
    </div>
    
</body>
</html>
